DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FUNGO SHOP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            padding: 16px;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #3b82f6;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header p {
            color: #8b949e;
            font-size: 13px;
            margin-top: 4px;
        }

        .profile-card {
            background: linear-gradient(135deg, #161b22 0%, #1f2937 100%);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            background: #2563eb;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .details .name {
            font-weight: 700;
            font-size: 16px;
        }

        .details .id {
            font-size: 12px;
            color: #8b949e;
            margin-top: 2px;
        }

        .balance-info {
            text-align: right;
        }

        .balance-info .label {
            font-size: 11px;
            color: #8b949e;
        }

        .balance-info .value {
            font-size: 16px;
            font-weight: 700;
            color: #10b981;
            margin-top: 2px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:active {
            transform: scale(0.96);
        }

        .card-banner {
            height: 70px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .pubg { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .ff { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .mlbb { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .roblox { background: linear-gradient(135deg, #6b7280, #4b5563); }

        .card-title {
            font-size: 14px;
            font-weight: 600;
        }

        .card-sub {
            font-size: 11px;
            color: #8b949e;
            margin-top: 4px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 6px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit { background: #2563eb; color: #fff; }
        .btn-cancel { background: #30363d; color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <h1>FUNGO SHOP</h1>
        <p>Hamyonbop va tezkor donat xizmati</p>
    </div>

    <!-- Profil va Balans kartasi -->
    <div class="profile-card">
        <div class="user-info">
            <div class="avatar" id="user-avatar">U</div>
            <div class="details">
                <div class="name" id="user-name">Foydalanuvchi</div>
                <div class="id" id="user-id">ID: 00000000</div>
            </div>
        </div>
        <div class="balance-info">
            <div class="label">Balans</div>
            <div class="value" id="user-balance">0 so'm</div>
        </div>
    </div>

    <!-- O'yinlar do'koni -->
    <div class="section-title">🎮 O'yinlar do'koni</div>
    
    <div class="grid">
        <div class="card" onclick="openOrderModal('PUBG Mobile', ['60 UC - 13,000 so\'m', '325 UC - 60,000 so\'m', '660 UC - 118,000 so\'m', '1800 UC - 310,000 so\'m'])">
            <div class="card-banner pubg">PUBG</div>
            <div class="card-title">PUBG Mobile</div>
            <div class="card-sub">UC to'ldirish</div>
        </div>

        <div class="card" onclick="openOrderModal('Free Fire', ['100 Almaz - 14,000 so\'m', '310 Almaz - 42,000 so\'m', '520 Almaz - 68,000 so\'m'])">
            <div class="card-banner ff">FREE FIRE</div>
            <div class="card-title">Free Fire</div>
            <div class="card-sub">Almaz to'ldirish</div>
        </div>

        <div class="card" onclick="openOrderModal('Mobile Legends', ['86 Diamonds - 20,000 so\'m', '172 Diamonds - 40,000 so\'m', '257 Diamonds - 60,000 so\'m'])">
            <div class="card-banner mlbb">MLBB</div>
            <div class="card-title">Mobile Legends</div>
            <div class="card-sub">Diamonds</div>
        </div>

        <div class="card" onclick="openOrderModal('Roblox', ['80 Robux - 18,000 so\'m', '400 Robux - 75,000 so\'m', '800 Robux - 140,000 so\'m'])">
            <div class="card-banner roblox">ROBLOX</div>
            <div class="card-title">Roblox</div>
            <div class="card-sub">Robux to'ldirish</div>
        </div>
    </div>

    <!-- Buyurtma modal oynasi -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div class="modal-title" id="modalGameTitle">Buyurtma berish</div>
            
            <div class="input-group">
                <label>O'yin Player ID / UID:</label>
                <input type="number" id="playerIdInput" placeholder="Masalan: 512345678">
            </div>

            <div class="input-group">
                <label>Paketni tanlang:</label>
                <select id="packageSelect"></select>
            </div>

            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeOrderModal()">Bekor qilish</button>
                <button class="btn btn-submit" onclick="submitOrder()">Sotib olish</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const RENDER_URL = "https://fungo-bot.onrender.com";
        let selectedGame = "";

        const user = tg.initDataUnsafe?.user;

        if (user) {
            document.getElementById('user-name').innerText = user.first_name || 'Foydalanuvchi';
            document.getElementById('user-id').innerText = `ID: ${user.id}`;
            document.getElementById('user-avatar').innerText = (user.first_name || 'U').charAt(0).toUpperCase();

            // Render backend serverdan balansni jonli olish
            fetch(`${RENDER_URL}/api/balance?user_id=${user.id}`)
                .then(res => res.json())
                .then(data => {
                    if (data.balance !== undefined) {
                        document.getElementById('user-balance').innerText = `${data.balance.toLocaleString()} so'm`;
                    }
                })
                .catch(err => console.error("Balansni yuklashda xatolik:", err));
        }

        function openOrderModal(gameName, packages) {
            selectedGame = gameName;
            document.getElementById('modalGameTitle').innerText = gameName;
            
            const select = document.getElementById('packageSelect');
            select.innerHTML = '';
            packages.forEach(pkg => {
                const opt = document.createElement('option');
                opt.value = pkg;
                opt.innerText = pkg;
                select.appendChild(opt);
            });

            document.getElementById('orderModal').style.display = "flex";
        }

        function closeOrderModal() {
            document.getElementById('orderModal').style.display = "none";
        }

        function submitOrder() {
            const playerId = document.getElementById('playerIdInput').value.trim();
            const selectedPackage = document.getElementById('packageSelect').value;

            if (!playerId) {
                alert("Iltimos, Player ID kiritasiz!");
                return;
            }

            const orderData = {
                game: selectedGame,
                player_id: playerId,
                package: selectedPackage
            };

            tg.sendData(JSON.stringify(orderData));
            closeOrderModal();
        }
    </script>
</body>
</html>
